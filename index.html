<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Personal Library Manager</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body>
    <main class="container mt-4">

        <header class="mb-4">
            <h1>Personal Library Manager</h1>
            <p class="lead">
                Organize the books you've read and the ones you still want to finish.
            </p>
        </header>

        <section class="card p-3 mb-3" aria-labelledby="add-book-heading">
            <h2 id="add-book-heading">Add a Book</h2>

            <form id="book-form">
                <div class="mb-3">
                    <label for="book-input" class="form-label">
                        Book Title
                    </label>

                    <input type="text" id="book-input" class="form-control" placeholder="Enter a book title"
                        autocomplete="off" required>
                </div>

                <button type="submit" class="btn btn-primary">
                    Add Book
                </button>

                <button type="button" id="library-status" class="btn btn-secondary"> Library Status </button>
            </form>
        </section>

        <section class="card p-3 mb-3" aria-labelledby="search-heading">
            <h2 id="search-heading">Search Books</h2>

            <label for="search-input" class="form-label">
                Search your library
            </label>

            <input type="search" id="search-input" class="form-control" placeholder="Search by book title"
                autocomplete="off">
        </section>

        <section class="card p-3 mb-3" aria-labelledby="filter-heading">
            <h2 id="filter-heading">Filter Library</h2>

            <fieldset>
                <legend class="visually-hidden">
                    Choose which books to display
                </legend>

                <div class="btn-group" role="group">
                    <button type="button" id="show-all" class="btn btn-secondary" aria-pressed="true">
                        All
                    </button>

                    <button type="button" id="show-read" class="btn btn-secondary" aria-pressed="false">
                        Read
                    </button>

                    <button type="button" id="show-unread" class="btn btn-secondary" aria-pressed="false">
                        Unread
                    </button>
                </div>
            </fieldset>
        </section>

        <section class="card p-3 mb-3" aria-labelledby="statistics-heading">
            <h2 id="statistics-heading">Library Statistics</h2>

            <ul class="list-group">
                <li class="list-group-item">
                    Total Books:
                    <span id="total-count">0</span>
                </li>

                <li class="list-group-item">
                    Read:
                    <span id="read-count">0</span>
                </li>

                <li class="list-group-item">
                    Unread:
                    <span id="unread-count">0</span>
                </li>
            </ul>
        </section>

        <section class="card p-3" aria-labelledby="library-heading">
            <h2 id="library-heading">Your Library</h2>

            <ul id="book-list" class="list-group">
                <!-- Books will appear here -->
            </ul>
        </section>

        <div id="status" aria-live="polite" aria-atomic="true" hidden>
        </div>

    </main>

    <script src="script.js"></script>
</body>

</html>
